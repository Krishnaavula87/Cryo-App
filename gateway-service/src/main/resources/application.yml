spring:
  application:
    name: gateway-service


  cloud:
    gateway:
      # 🔴 USE THIS EXACT FORMAT
      default-filters:
        - name: DedupeResponseHeader
          args:
            name: Access-Control-Allow-Origin Access-Control-Allow-Credentials
            strategy: RETAIN_FIRST

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:8085"
              - "http://localhost:5173"
              - "http://localhost:8080"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

# ... rest of your config ...ss

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true

jwt:
  secret: ${jwt_secret}
  expiration: 86400

logging:
  level:
    com.cryo.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
# //these line should  remove please rememeber Gopala.
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /auth/v3/api-docs
      - name: Freezer Service
        url: /freezers/v3/api-docs
      - name: Alert Service
        url: /alerts/v3/api-docs
      - name: Export Service
        url: /export/v3/api-docs

